name: T3 v005 CPU screen

on:
  push:
    branches: [t3-experiment-v005]
    paths:
      - 'deployment/benchmark_t3_v005.py'
      - 'deployment/cpu-v005.yml'
      - 'tools/test_t3_v005_benchmark.py'
      - 't3/cpu_agent_v005_candidate.py'
      - '.github/workflows/cpu-v005.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenthon-t3-v005-confirmation
  cancel-in-progress: false

jobs:
  confirm:
    # Only free standard public-repository CPU runners; no publish/cache/artifacts.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned host-only Parquet readers
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4 pyarrow==15.0.2
      - name: Check source direction, bindings and fixed gates offline
        run: python -m unittest discover -s tools -p test_t3_v005_benchmark.py -v
      - name: Confirm frozen v005 against the verified v004 image
        run: |
          set -euo pipefail
          python deployment/benchmark_t3_v005.py --work .v005-confirmation
