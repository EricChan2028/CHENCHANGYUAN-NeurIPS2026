name: CPU container build and public smoke

on:
  push:
    branches: [main]
    paths:
      - 't2/**'
      - 't3/**'
      - 'deployment/**'
      - '.github/workflows/cpu-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to GHCR (package must be made public)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: agenthon-cpu-images
  cancel-in-progress: false

jobs:
  build:
    # Evaluated before runner allocation. Private-repository minutes must not be used.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        track: [t2, t3]
    env:
      TRACK: ${{ matrix.track }}
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Fetch pinned public validators and public practice inputs
        run: |
          set -euo pipefail
          python deployment/container_smoke.py fetch --track "$TRACK" --work .ci
          python -m pip install -r deployment/validator-requirements.txt
          python -m pip install --no-deps ".ci/$TRACK"
      - name: Build CPU image from the track context only
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "local/agenthon-$TRACK:$GITHUB_SHA" "$TRACK"
      - name: Exercise the actual CLI offline, inspect image and run official public gates
        run: |
          set -euo pipefail
          python deployment/container_smoke.py check --track "$TRACK" --work .ci --image "local/agenthon-$TRACK:$GITHUB_SHA"
      - name: Confirm T3 speed against frozen v002 with exact output checks
        if: ${{ matrix.track == 't3' }}
        run: |
          set -euo pipefail
          python deployment/benchmark_t3_pair.py --image "local/agenthon-$TRACK:$GITHUB_SHA" --work .ci --report .ci/t3-paired-report.json
      - name: Publish the tested image and record its immutable digest
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eastern-eagles-$TRACK:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag "local/agenthon-$TRACK:$GITHUB_SHA" "$image"
          docker push "$image"
          python deployment/container_smoke.py published --track "$TRACK" --work .ci --image "$image"
      - name: Verify anonymous image and layer access
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          set -euo pipefail
          python deployment/verify_public_image.py ".ci/published-$TRACK.json"
      - name: Report scope of verification
        if: ${{ success() }}
        run: |
          printf '%s\n' "### $TRACK" 'CPU container public-example check passed. This is not a private-test score or submission.' >> "$GITHUB_STEP_SUMMARY"
          if test -f ".ci/published-$TRACK.json"; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat ".ci/published-$TRACK.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
